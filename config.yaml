# Warden 配置文件（所有字段均可被环境变量覆盖，前缀 WARDEN_）

# 运行模式：
#   server —— 控制端，提供 Web 界面、账号体系、主机纳管（默认）
#   agent  —— 被管端，只暴露运维接口，由控制端带令牌访问
mode: "server"

# ---------- 控制端 ----------
listen: ":3001"
data_dir: "./data"
# 文件管理可访问的根目录；Linux 上通常为 "/"，可缩小到 /data 提高安全性
file_root: "/"
# 不填则自动生成到 data/jwt.key
jwt_secret: ""
token_hours: 24
# 启用 HTTPS 时填写
cert_file: ""
key_file: ""

# ---------- 被管端（mode=agent 时生效）----------
agent_listen: ":3002"
# 必须与控制端「添加主机」时生成的令牌一致，否则一律拒绝
agent_token: ""
# 仅用于日志与界面展示
agent_name: ""

# ---------- 通用 ----------
log_level: "info"
# 启动时自动在防火墙放行监听端口（控制端放行 listen，被管端放行 agent_listen）。
# 只新增一条 allow 规则，不会启停防火墙；需要 root 权限，已存在则跳过。
auto_open_port: true
# Docker Engine API 端点，留空使用本机默认值：
#   Linux / WSL 内运行 → unix:///var/run/docker.sock
#   Windows           → npipe:////./pipe/docker_engine（Docker Desktop）
# 也可填远程 daemon，如 tcp://10.0.0.5:2375。
# 注意：Windows 进程访问不到 WSL 虚拟机内的 /var/run/docker.sock。想管 WSL 里的
# Docker，推荐把被管端 Agent 装在 WSL 内、用多主机方式接入；或者让 WSL 内的 dockerd
# 额外监听 TCP（-H tcp://127.0.0.1:2375，务必只绑回环地址）后在此填 tcp://127.0.0.1:2375。
docker_host: ""
# 本机终端使用的 shell，留空自动探测：
#   Linux            → $SHELL（退回 /bin/bash）
#   Windows          → PowerShell（有 pwsh 时也可在页面上切到 PowerShell 7 / CMD）
# 也可写死路径，如 /usr/bin/zsh 或 C:\Program Files\PowerShell\7\pwsh.exe
shell: ""

# ---------- 定时备份 ----------
# MySQL 备份文件的落盘目录，留空使用 data_dir/backups。
# 备份可能很大，挂到独立磁盘时改这里即可（目录不存在会自动创建）。
backup_dir: ""
